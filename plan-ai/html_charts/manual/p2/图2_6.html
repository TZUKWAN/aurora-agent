<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1920px; height:1080px; background:#0a0a1a; font-family:"Microsoft YaHei","PingFang SC",sans-serif; overflow:hidden; }
.title { position:absolute; left:60px; top:40px; font-size:28px; font-weight:700; color:#00e5ff; letter-spacing:2px; text-shadow:0 0 20px rgba(0,229,255,0.4); }
.subtitle { position:absolute; left:60px; top:78px; font-size:14px; color:#546e7a; }
.grid-bg { position:absolute; inset:0; background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px); background-size:40px 40px; }
.canvas { position:absolute; left:60px; top:130px; width:1800px; height:880px; display:flex; gap:24px; }
.col { display:flex; flex-direction:column; gap:16px; }
.c1 { flex:1.2; }
.c2 { flex:1; }
.card { background:rgba(255,255,255,0.03); border:1px solid rgba(0,229,255,0.2); border-radius:14px; padding:18px 22px; }
.ch { font-size:15px; font-weight:700; color:#00e5ff; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.kpi { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.kc { text-align:center; padding:16px; border-radius:10px; background:rgba(255,255,255,0.03); border:1px solid rgba(0,229,255,0.15); }
.kv { font-size:26px; font-weight:700; }
.kl { font-size:10px; color:#78909c; margin-top:6px; }
.chart { position:relative; height:200px; }
.trend { display:flex; align-items:flex-end; justify-content:center; gap:16px; height:160px; padding:0 20px; }
.tg { display:flex; flex-direction:column; align-items:center; gap:6px; }
.tb { width:50px; border-radius:6px 6px 0 0; position:relative; }
.tv { position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; white-space:nowrap; }
.tl { font-size:10px; color:#78909c; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="title">图2-6 运营数据看板 — 平台核心指标监控</div>
<div class="subtitle">OPERATIONS DASHBOARD · 用户 · 场景 · 仿真 · 收入 · 系统健康</div>
<div class="canvas">
  <div class="col c1">
    <div class="card">
      <div class="ch">📊 核心运营指标</div>
      <div class="kpi">
        <div class="kc"><div class="kv" style="color:#00e5ff">85</div><div class="kl">付费客户数</div></div>
        <div class="kc"><div class="kv" style="color:#7c4dff">320</div><div class="kl">注册用户</div></div>
        <div class="kc"><div class="kv" style="color:#00e676">10.5M</div><div class="kl">场景库规模</div></div>
        <div class="kc"><div class="kv" style="color:#ff9100">2.8M</div><div class="kl">月仿真次数</div></div>
        <div class="kc"><div class="kv" style="color:#ff5252">¥500万</div><div class="kl">ARR 年收入</div></div>
        <div class="kc"><div class="kv" style="color:#78909c">98.5%</div><div class="kl">系统可用性</div></div>
      </div>
    </div>
    <div class="card">
      <div class="ch">📈 月度仿真量趋势</div>
      <div class="chart">
        <svg width="100%" height="100%" viewBox="0 0 900 200">
          <g transform="translate(60,20)">
            <line x1="0" y1="160" x2="780" y2="160" stroke="rgba(255,255,255,0.1)"/>
            <text x="0" y="12" font-size="11" fill="#78909c">仿真量(万次)</text>
            <text x="0" y="175" font-size="10" fill="#546e7a" text-anchor="middle">1月</text>
            <text x="130" y="175" font-size="10" fill="#546e7a" text-anchor="middle">3月</text>
            <text x="260" y="175" font-size="10" fill="#546e7a" text-anchor="middle">5月</text>
            <text x="390" y="175" font-size="10" fill="#546e7a" text-anchor="middle">7月</text>
            <text x="520" y="175" font-size="10" fill="#546e7a" text-anchor="middle">9月</text>
            <text x="650" y="175" font-size="10" fill="#546e7a" text-anchor="middle">11月</text>
            <text x="780" y="175" font-size="10" fill="#546e7a" text-anchor="middle">12月</text>
            <polyline points="0,140 65,120 130,100 195,85 260,70 325,60 390,50 455,45 520,40 585,35 650,30 715,25 780,20" fill="none" stroke="#00e5ff" stroke-width="3"/>
            <circle cx="0" cy="140" r="5" fill="#00e5ff"/>
            <circle cx="130" cy="100" r="5" fill="#00e5ff"/>
            <circle cx="260" cy="70" r="5" fill="#00e5ff"/>
            <circle cx="390" cy="50" r="5" fill="#00e5ff"/>
            <circle cx="520" cy="40" r="5" fill="#00e5ff"/>
            <circle cx="650" cy="30" r="5" fill="#00e5ff"/>
            <circle cx="780" cy="20" r="7" fill="#00e5ff" stroke="#0a0a1a" stroke-width="3"/>
            <text x="780" y="10" font-size="12" fill="#00e5ff" font-weight="700" text-anchor="middle">2.8M</text>
          </g>
        </svg>
      </div>
    </div>
  </div>
  <div class="col c2">
    <div class="card">
      <div class="ch">🎯 客户分布</div>
      <svg width="100%" height="200" viewBox="0 0 500 200">
        <g transform="translate(100,100)">
          <path d="M 0,-80 A 80,80 0 0,1 76.08,-24.72 L 0,0 Z" fill="#00e5ff"/>
          <path d="M 76.08,-24.72 A 80,80 0 0,1 40.57,69.08 L 0,0 Z" fill="#7c4dff"/>
          <path d="M 40.57,69.08 A 80,80 0 0,1 -53.75,59.41 L 0,0 Z" fill="#00e676"/>
          <path d="M -53.75,59.41 A 80,80 0 0,1 -78.39,-16.18 L 0,0 Z" fill="#ff9100"/>
          <path d="M -78.39,-16.18 A 80,80 0 0,1 0,-80 L 0,0 Z" fill="#ff5252"/>
          <circle r="32" fill="#0a0a1a"/>
          <text x="0" y="4" text-anchor="middle" font-size="10" fill="#00e5ff" font-weight="700">85家</text>
        </g>
        <text x="220" y="50" font-size="12" fill="#00e5ff">■ 车企 35%</text>
        <text x="220" y="75" font-size="12" fill="#7c4dff">■ 初创 30%</text>
        <text x="220" y="100" font-size="12" fill="#00e676">■ Tier1 20%</text>
        <text x="220" y="125" font-size="12" fill="#ff9100">■ 高校 10%</text>
        <text x="220" y="150" font-size="12" fill="#ff5252">■ 其他 5%</text>
      </svg>
    </div>
    <div class="card">
      <div class="ch">⚡ 系统资源使用</div>
      <div class="trend">
        <div class="tg"><div class="tb" style="height:120px;background:linear-gradient(180deg,#00e5ff,#0091ea);"><div class="tv" style="color:#00e5ff;">78%</div></div><div class="tl">GPU</div></div>
        <div class="tg"><div class="tb" style="height:80px;background:linear-gradient(180deg,#7c4dff,#651fff);"><div class="tv" style="color:#7c4dff;">52%</div></div><div class="tl">CPU</div></div>
        <div class="tg"><div class="tb" style="height:100px;background:linear-gradient(180deg,#00e676,#00c853);"><div class="tv" style="color:#00e676;">65%</div></div><div class="tl">内存</div></div>
        <div class="tg"><div class="tb" style="height:60px;background:linear-gradient(180deg,#ff9100,#ff6d00);"><div class="tv" style="color:#ff9100;">38%</div></div><div class="tl">存储</div></div>
        <div class="tg"><div class="tb" style="height:40px;background:linear-gradient(180deg,#ff5252,#d50000);"><div class="tv" style="color:#ff5252;">22%</div></div><div class="tl">网络</div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
