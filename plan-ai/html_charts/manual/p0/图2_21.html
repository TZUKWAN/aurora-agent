<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1920px; height:1080px;
  background:#fff;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  overflow:hidden;
}
.title {
  position:absolute; left:60px; top:40px;
  font-size:28px; font-weight:700; color:#1a237e;
  letter-spacing:2px;
}
.subtitle {
  position:absolute; left:60px; top:78px;
  font-size:14px; color:#78909c;
}

.canvas { position:absolute; left:60px; top:130px; width:900px; height:880px; }

/* 雷达图 */
.radar-svg { width:100%; height:100%; }

/* 右侧对比表 */
.compare-panel {
  position:absolute; right:60px; top:130px;
  width:840px;
}
.cp-title { font-size:16px; font-weight:700; color:#1a237e; margin-bottom:16px; }

.comp-row {
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; margin:8px 0;
  background:#f5f7fa; border-radius:10px;
  border:2px solid #e3eaf5;
}
.comp-row.highlight { border-color:#3949ab; background:#e8eaf6; }
.comp-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; }
.comp-info { flex:1; }
.comp-name { font-size:13px; font-weight:700; }
.comp-desc { font-size:10px; color:#78909c; margin-top:2px; }
.comp-score { font-size:20px; font-weight:700; width:60px; text-align:right; }
.comp-bar { width:100px; height:6px; background:#e3eaf5; border-radius:3px; overflow:hidden; }
.comp-bar-fill { height:100%; border-radius:3px; }
</style>
</head>
<body>
<div class="title">图2-21 云跃引擎竞争对手对标分析 — 多维度雷达图</div>
<div class="subtitle">COMPETITOR RADAR · 6维度评估 · 0-100分 · 面积=综合实力</div>

<div class="canvas">
  <svg class="radar-svg" viewBox="0 0 500 500">
    <!-- 背景网格 -->
    <polygon points="250,50 423,150 423,350 250,450 77,350 77,150" fill="none" stroke="#e3eaf5" stroke-width="1"/>
    <polygon points="250,100 398,175 398,325 250,400 102,325 102,175" fill="none" stroke="#e3eaf5" stroke-width="1"/>
    <polygon points="250,150 373,200 373,300 250,350 127,300 127,200" fill="none" stroke="#e3eaf5" stroke-width="1"/>
    <polygon points="250,200 348,225 348,275 250,300 152,275 152,225" fill="none" stroke="#e3eaf5" stroke-width="1"/>
    <polygon points="250,250 323,250 323,250 250,250 177,250 177,250" fill="none" stroke="#e3eaf5" stroke-width="1"/>
    
    <!-- 轴线 -->
    <line x1="250" y1="250" x2="250" y2="50" stroke="#c5cae9" stroke-width="1"/>
    <line x1="250" y1="250" x2="423" y2="150" stroke="#c5cae9" stroke-width="1"/>
    <line x1="250" y1="250" x2="423" y2="350" stroke="#c5cae9" stroke-width="1"/>
    <line x1="250" y1="250" x2="250" y2="450" stroke="#c5cae9" stroke-width="1"/>
    <line x1="250" y1="250" x2="77" y2="350" stroke="#c5cae9" stroke-width="1"/>
    <line x1="250" y1="250" x2="77" y2="150" stroke="#c5cae9" stroke-width="1"/>
    
    <!-- 阿里云 ACK -->
    <polygon points="250,90 410,160 400,340 250,380 110,320 100,160" fill="rgba(255,106,0,0.1)" stroke="#ff6a00" stroke-width="2"/>
    
    <!-- 云跃引擎 -->
    <polygon points="250,80 390,155 385,320 250,360 120,310 115,155" fill="rgba(26,35,126,0.15)" stroke="#1a237e" stroke-width="3"/>
    
    <!-- Rancher -->
    <polygon points="250,120 370,175 360,330 250,370 130,330 120,175" fill="rgba(0,117,168,0.1)" stroke="#0075a8" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- 标签 -->
    <text x="250" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1a237e">产品技术</text>
    <text x="445" y="145" text-anchor="start" font-size="12" font-weight="700" fill="#1a237e">市场执行</text>
    <text x="445" y="365" text-anchor="start" font-size="12" font-weight="700" fill="#1a237e">生态开放</text>
    <text x="250" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#1a237e">价格优势</text>
    <text x="55" y="365" text-anchor="end" font-size="12" font-weight="700" fill="#1a237e">开发者体验</text>
    <text x="55" y="145" text-anchor="end" font-size="12" font-weight="700" fill="#1a237e">安全合规</text>
  </svg>
</div>

<!-- 右侧对比 -->
<div class="compare-panel">
  <div class="cp-title">📊 六维度综合评分</div>
  
  <div class="comp-row highlight">
    <div class="comp-icon" style="background:#3949ab; color:#fff;">🔥</div>
    <div class="comp-info">
      <div class="comp-name">云跃引擎</div>
      <div class="comp-desc">零配置部署 · 多维灰度 · 智能调度</div>
    </div>
    <div class="comp-score" style="color:#3949ab;">86</div>
    <div class="comp-bar"><div class="comp-bar-fill" style="width:86%; background:#3949ab"></div></div>
  </div>
  
  <div class="comp-row">
    <div class="comp-icon" style="background:#ff6a00; color:#fff;">☁</div>
    <div class="comp-info">
      <div class="comp-name">阿里云 ACK</div>
      <div class="comp-desc">生态完善 · 市场领先 · 云锁定</div>
    </div>
    <div class="comp-score" style="color:#ff6a00;">82</div>
    <div class="comp-bar"><div class="comp-bar-fill" style="width:82%; background:#ff6a00"></div></div>
  </div>
  
  <div class="comp-row">
    <div class="comp-icon" style="background:#ee0000; color:#fff;">🏢</div>
    <div class="comp-info">
      <div class="comp-name">OpenShift</div>
      <div class="comp-desc">企业安全 · 金融首选 · 昂贵</div>
    </div>
    <div class="comp-score" style="color:#ee0000;">78</div>
    <div class="comp-bar"><div class="comp-bar-fill" style="width:78%; background:#ee0000"></div></div>
  </div>
  
  <div class="comp-row">
    <div class="comp-icon" style="background:#0075a8; color:#fff;">🐂</div>
    <div class="comp-info">
      <div class="comp-name">Rancher</div>
      <div class="comp-desc">多云原生 · 开源友好 · 增长放缓</div>
    </div>
    <div class="comp-score" style="color:#0075a8;">72</div>
    <div class="comp-bar"><div class="comp-bar-fill" style="width:72%; background:#0075a8"></div></div>
  </div>
  
  <div class="comp-row">
    <div class="comp-icon" style="background:#00a3ff; color:#fff;">📱</div>
    <div class="comp-info">
      <div class="comp-name">腾讯云 TKE</div>
      <div class="comp-desc">游戏场景 · 视频优化 · 生态弱</div>
    </div>
    <div class="comp-score" style="color:#00a3ff;">68</div>
    <div class="comp-bar"><div class="comp-bar-fill" style="width:68%; background:#00a3ff"></div></div>
  </div>
  
  <div class="comp-row">
    <div class="comp-icon" style="background:#cf0a2c; color:#fff;">🇨🇳</div>
    <div class="comp-info">
      <div class="comp-name">华为云 CCE</div>
      <div class="comp-desc">政企市场 · 信创红利 · 开发者弱</div>
    </div>
    <div class="comp-score" style="color:#cf0a2c;">70</div>
    <div class="comp-bar"><div class="comp-bar-fill" style="width:70%; background:#cf0a2c"></div></div>
  </div>
</div>

</body>
</html>
