[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-agent"
version = "0.1.0"
description = "AuroraAgent -- AI assistant for university student innovation and entrepreneurship competitions"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "jinja2>=3.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pandas>=2.0,<3",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "python-docx>=1.1",
    "scipy>=1.10",
    "pymupdf>=1.24",
    "scikit-learn>=1.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
cli = ["prompt_toolkit>=3.0", "rich>=13.0"]
web = ["fastapi>=0.111.0", "uvicorn>=0.30.0", "jinja2>=3.1"]
analysis = ["scipy>=1.10", "scikit-learn>=1.3", "seaborn>=0.13"]
export = ["python-docx>=1.1", "pylatex>=1.4"]
anthropic = ["anthropic>=0.30.0"]
all = ["aurora-agent[cli,web,analysis,export,anthropic]"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aurora = "aurora.__main__:main"

[tool.setuptools.packages.find]
include = ["aurora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
