[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-agent"
version = "0.1.0"
description = "AuroraAgent -- AI assistant for university student innovation and entrepreneurship competitions"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "duckduckgo-search>=5.3.1",
]

[project.optional-dependencies]
cli = ["prompt_toolkit>=3.0", "rich>=13.0"]
visuals = ["playwright>=1.40.0"]
anthropic = ["anthropic>=0.30.0"]
all = ["aurora-agent[cli,visuals,anthropic]"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aurora = "aurora.__main__:main"

[tool.setuptools.packages.find]
include = ["aurora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
